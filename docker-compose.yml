services:
  sehooks:
    build: .
    image: ghcr.io/exirostudio/script-execution-hooks:latest
    container_name: sehooks
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SEH_ADMIN_PASSWORD=admin # Change this to a strong password
      - SEH_SECRET_KEY=change-me-in-production
      - SEH_PORT=8080
      - SEH_DB_PATH=/data/hooks.db
      # Option A: Automatic GHCR login via token
      # - GHCR_TOKEN=ghp_your_github_personal_access_token
      # - GHCR_USERNAME=your_github_username
    volumes:
      - sehooks_data:/data
      # Mount host docker socket if scripts run docker commands on host
      - /var/run/docker.sock:/var/run/docker.sock
      # Option B: Inherit docker login credentials from host (~/.docker)
      - ${HOME}/.docker:/root/.docker:ro
      # Optional: Mount host workspace for deployment scripts
      # - /var/www:/var/www

volumes:
  sehooks_data:
